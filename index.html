<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Industrias del Norte</title>
    <link rel="stylesheet" href="estilos.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="contenedor">
        <div class="logo-container">
            <img src="encabezado.png" alt="Logo Industrias del Norte" class="logo">
        </div>
        <h2>Acceso al Sistema</h2>
        <form id="loginform" action="#" method="post">
            <div class="grupo">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ingrese su usuario">
            </div>
            
            <div class="grupo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingrese su contraseña">
            </div>
            
            <div class="grupo">
                <input type="button" value="Acceder" id="enviar" onclick="logo()">
            </div>
            
            <div id="mensaje-error" class="mensaje-error"></div>
        </form>
        
        <div class="enlaces-adicionales">
            <a href="#" onclick="recuperarPassword()">¿Olvidó su contraseña?</a>
            <a href="#" onclick="soporteTecnico()">Soporte técnico</a>
        </div>
    </div>

    
    <div id="mensaje-error" class="mensaje-error" style="display: none;"></div>

    <script src="codigo1.js"></script>
</body>
</html>
